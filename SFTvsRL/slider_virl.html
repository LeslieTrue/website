<!DOCTYPE html>
<html>
<head>
    <style>
        .slider-container {
            width: 100%;
            max-width: 900px;
            height: 230px;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
        }

        .slides-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 100px;
            color: white;
            flex-shrink: 0; /* Prevent slides from shrinking */
        }

        .figure-1 { background: #FFFFFF; }
        .figure-2 { background: #FFFFFF; }
        .figure-3 { background: #FFFFFF; }

        /* Arrow controls styling */
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(188, 188, 188, 0.5);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease;
            z-index: 10;
        }

        .arrow:hover {
            background: rgba(188, 188, 188, 0.5);
        }

        .arrow-left {
            left: 20px;
        }

        .arrow-right {
            right: 20px;
        }

        .arrow::before {
            content: '';
            width: 10px;
            height: 10px;
            border-top: 3px solid white;
            border-right: 3px solid white;
            display: block;
        }

        .arrow-left::before {
            transform: rotate(-135deg);
        }

        .arrow-right::before {
            transform: rotate(45deg);
        }

        .dots {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #D9F3F7;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .dot.active {
            background: #265073 10%;
        }
    </style>
</head>
<body>
    <div class="slider-container">
        <!-- Arrow controls -->
        <div class="arrow arrow-left"></div>
        <div class="arrow arrow-right"></div>

        <!-- Slides wrapper -->
        <div class="slides-wrapper">
            <div class="slide figure-1"><img src="assets/virl_vl_indist.svg" style="width: 80%;"></div>
            <div class="slide figure-2"><img src="assets/virl_vl_vood.svg" style="width: 80%;"></div>
            <div class="slide figure-3"><img src="assets/virl_vl_rood.svg" style="width: 80%;"></div>
            <div class="slide figure-4"><img src="assets/virl_l_indist.svg" style="width: 80%;"></div>
            <div class="slide figure-5"><img src="assets/virl_l_ood.svg" style="width: 80%;"></div>
        </div>
        
        <!-- Dots -->
        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        const slidesWrapper = document.querySelector('.slides-wrapper');
        const dots = document.querySelectorAll('.dot');
        const arrowLeft = document.querySelector('.arrow-left');
        const arrowRight = document.querySelector('.arrow-right');
        let currentSlide = 0;
        const totalSlides = dots.length;

        function updateSlider(index) {
            // Handle index wrapping
            if (index < 0) index = totalSlides - 1;
            if (index >= totalSlides) index = 0;
            
            // Update transform
            slidesWrapper.style.transform = `translateX(-${index * 100}%)`;
            
            // Update dots
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            currentSlide = index;
        }

        // Add click events to arrows
        arrowLeft.addEventListener('click', () => {
            updateSlider(currentSlide - 1);
        });

        arrowRight.addEventListener('click', () => {
            updateSlider(currentSlide + 1);
        });

        // Add click events to dots
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                updateSlider(index);
            });
        });

    </script>
</body>
</html>
